<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>铜产品减量化模型智能体</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <!-- ================= 左侧：任务配置面板 ================= -->
  <aside class="panel-left">
    <nav class="tabs">
      <button class="tab active" data-tab="single">运行一次</button>
      <button class="tab" data-tab="batch">批量运行</button>
    </nav>

    <section class="form">
      <label class="field-label">目标产品 <span class="hint" id="select-hint">（单选）</span></label>
      <div class="product-grid" id="product-grid"></div>

      <label class="field-label" for="region">研究国家 <span class="hint">（国家级模型，自动映射GCAM区域）</span></label>
      <div class="input-wrap">
        <input id="region" type="text" value="中国" list="region-list" autocomplete="off">
        <span class="input-icon">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#8a97ab" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg>
        </span>
      </div>
      <datalist id="region-list"></datalist>

      <label class="field-label" for="baseline-year">调研基准年</label>
      <div class="input-wrap">
        <input id="baseline-year" type="number" value="2025" min="2000" max="2035">
        <span class="input-icon">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#8a97ab" stroke-width="1.4" stroke-linecap="round"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg>
        </span>
      </div>

      <label class="field-label" for="constraints">补充约束 <span class="hint">（选填）</span></label>
      <div class="textarea-wrap">
        <textarea id="constraints" rows="4" maxlength="500" placeholder="如：聚焦中国市场、需引用国标/行标、区分子类别分别给出数据…"></textarea>
        <span class="char-counter" id="char-counter">0/500</span>
      </div>

      <div class="actions">
        <button id="btn-clear" class="btn ghost">清空</button>
        <div class="actions-right">
          <button id="btn-stop" class="btn stop" title="停止本地后台服务">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="3"/><rect x="6.2" y="6.2" width="3.6" height="3.6" rx="0.8" fill="currentColor" stroke="none"/></svg>
            停止后台服务
          </button>
          <button id="btn-run" class="btn primary">开始运行</button>
        </div>
      </div>

    </section>
  </aside>

  <!-- ================= 中间：统一任务工作区 ================= -->
  <main class="panel-right">
    <!-- 人工审核卡片（waiting_review 时显示） -->
    <div id="review-card" class="card review-card" hidden>
      <div class="card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.6V12l2.8 1.7"/></svg>
        人工审核关卡
      </div>
      <p class="review-note">产品调研已完成并暂停，请审核以下成果预览（对应 schema 的 ProductResearchOutput）：</p>
      <div id="review-summary" class="review-summary"></div>
      <div id="review-body" class="review-body"></div>
      <div class="review-actions">
        <button id="btn-approve" class="btn primary">✓ 通过并定稿</button>
        <select id="reject-target" class="select-inline">
          <option value="country_agent">打回：国家市场与标准研究员</option>
          <option value="dimension_agent">打回：维度分析师</option>
          <option value="structure_agent">打回：结构分析师</option>
          <option value="copper_agent">打回：铜部件识别</option>
        </select>
        <input id="reject-note" class="input-inline" placeholder="打回意见（选填）">
        <button id="btn-reject" class="btn ghost danger">✗ 打回重做</button>
      </div>
    </div>

    <!-- 工作流步骤条：置于统一任务状态卡上方，先展示当前所处阶段 -->
    <div class="card workflow-card" id="workflow-card" hidden>
      <div class="card-title" id="workflow-title">工作流</div>
      <div id="workflow-steps" class="workflow-steps"></div>
      <div id="run-status-line" class="run-status-line" hidden></div>
    </div>

    <!-- 统一任务状态卡：产品调研/审核/减量化仍是独立后端流程，前端呈现为一个连续任务 -->
    <div class="card run-overview-card" id="run-overview-card" hidden>
      <div class="overview-status">
        <div class="overview-ring"></div>
        <div class="overview-copy">
          <div class="overview-title" id="overview-title">正在准备运行</div>
          <div class="overview-note" id="overview-note">调研成果与减量化分析将在同一任务中连续展示</div>
        </div>
        <div class="overview-percent" id="overview-percent">—</div>
      </div>
      <div class="overview-progress"><span id="overview-progress-bar"></span></div>
      <div class="overview-panels">
        <div class="overview-panel research-panel">
          <div class="overview-panel-head">
            <span class="overview-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7.5A1.5 1.5 0 0 0 6 4.5v15A1.5 1.5 0 0 0 7.5 21h9a1.5 1.5 0 0 0 1.5-1.5V7z"/><path d="M14 3v4h4"/><path d="M9.5 12.5h5M9.5 16h3.5"/></svg>
            </span>
            <b>调研成果</b>
            <span class="status-pill success" id="research-status">待开始</span>
          </div>
          <div class="overview-panel-text" id="research-summary">型号与含铜部位、证据与国家研究范围</div>
        </div>
        <div class="overview-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h14"/><path d="M13 7l5 5-5 5"/></svg>
        </div>
        <div class="overview-panel reduction-panel">
          <div class="overview-panel-head">
            <span class="overview-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 20v-4.5M12 20V9.5M18.5 20V4.5"/></svg>
            </span>
            <b>减量化分析</b>
            <span class="status-pill running" id="reduction-status">待开始</span>
          </div>
          <div class="overview-panel-text" id="reduction-summary">基线、减量措施与定量建模</div>
          <button id="btn-reduction" class="btn primary small overview-action" hidden>开始减量化分析</button>
        </div>
      </div>
    </div>

    <!-- 保留图内节点执行与大模型流式输出；上方步骤条只表示任务阶段 -->
    <div class="card workflow-detail-card" id="workflow-detail-card" hidden>
      <div class="detail-card-head">
        <div>
          <div class="card-title">执行过程</div>
          <p>点击节点查看该 Agent 的实时结构化输出与来源。</p>
        </div>
        <span class="detail-live" id="detail-live" hidden>● 实时输出</span>
      </div>
      <div id="workflow-detail-steps" class="workflow-detail-steps"></div>
    </div>

    <!-- 执行事件流 -->
    <div class="card events-card" id="events-card" hidden>
      <div class="card-title">执行日志</div>
      <div id="events-list" class="events-list"></div>
    </div>

    <!-- 结果面板 -->
    <div class="card result-card" id="result-card" hidden>
      <div class="result-header">
        <div class="card-title">调研成果</div>
        <div class="result-actions">
          <a id="btn-export-xlsx" class="btn outline small" hidden>
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 13.5h11"/></svg>导出 Excel
          </a>
          <a id="btn-export-json" class="btn outline small" hidden><span class="mono">{ }</span>导出 JSON</a>
        </div>
      </div>
      <nav class="tabs result-tabs" id="result-tabs"></nav>
      <div id="result-body" class="result-body"></div>
    </div>

    <div id="placeholder" class="placeholder">
      <div class="placeholder-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.6-3.6"/><path d="M8.5 11h5"/></svg>
      </div>
      <p>选择产品并点击「开始运行」<br>工作流进度与调研成果将在此展示</p>
    </div>
  </main>

  <!-- ================= 右侧：合并运行历史 ================= -->
  <aside class="panel-history">
    <div id="run-history" class="run-history">
      <div class="history-head">
        <div class="history-title">运行历史</div>
        <div class="history-actions">
          <button id="btn-delete-selected" class="history-delete" type="button" disabled>删除选中</button>
          <button id="btn-clear-history" class="history-clear" type="button">清空历史</button>
          <select id="history-filter" class="history-filter" title="按运行结果筛选">
            <option value="all">全部</option>
            <option value="success">仅成功</option>
            <option value="failure">仅失败</option>
          </select>
        </div>
      </div>
      <div id="history-list" class="history-list"><div class="empty">暂无运行记录</div></div>
    </div>
  </aside>
</div>

<script src="/static/app.js"></script>
</body>
</html>
